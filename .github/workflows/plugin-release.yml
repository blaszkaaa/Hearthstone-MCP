name: Publish HDT plugin for one-click updater

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'scripts/build-plugin.ps1'
      - '.github/workflows/plugin-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hdt-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned HDT binaries
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "hdt.zip"
          $folder = Join-Path $env:RUNNER_TEMP "hdt"
          Invoke-WebRequest -Uri "https://github.com/HearthSim/Hearthstone-Deck-Tracker/releases/download/v1.55.6/Hearthstone.Deck.Tracker-v1.55.6.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          $exe = Get-ChildItem -Path $folder -File -Recurse | Where-Object { $_.Name -eq "Hearthstone Deck Tracker.exe" } | Select-Object -First 1
          if (-not $exe) { throw "Pinned HDT binaries not found" }
          "HDT_PATH=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
      - name: Build release DLL
        shell: pwsh
        run: |
          dotnet build plugin/HearthstoneMcpPlugin.csproj -c Release "-p:HdtPath=$env:HDT_PATH"
          if ($LASTEXITCODE -ne 0) { throw "Plugin build failed" }
          $dll = "plugin/bin/Release/net472/HearthstoneMcpPlugin.dll"
          if (-not (Test-Path $dll)) { throw "Plugin DLL missing" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll "dist/HearthstoneMcpPlugin.dll"
          $sha = (Get-FileHash -Algorithm SHA256 "dist/HearthstoneMcpPlugin.dll").Hash.ToUpperInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "dist/HearthstoneMcpPlugin.dll.sha256"), $sha + "`n")
      - name: Publish plugin-latest assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view plugin-latest 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create plugin-latest --target "$env:GITHUB_SHA" --title "Hearthstone MCP — aktualna DLL HDT" --notes "Wersja dla automatycznej aktualizacji przez Hearthstone AI Coach. Wtyczka HDT, nie biblioteka wstrzykiwana do gry." --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not create plugin-latest release" }
          }
          gh release upload plugin-latest "dist/HearthstoneMcpPlugin.dll" "dist/HearthstoneMcpPlugin.dll.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish plugin assets" }
