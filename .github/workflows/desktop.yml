name: Windows AI Coach build
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'plugin/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'plugin/**'
      - '.github/workflows/desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core tests
        run: dotnet run --project desktop/Coach.Checks/Coach.Checks.csproj -c Release
      - name: Download pinned HDT binaries
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "hdt.zip"
          $folder = Join-Path $env:RUNNER_TEMP "hdt"
          Invoke-WebRequest -Uri "https://github.com/HearthSim/Hearthstone-Deck-Tracker/releases/download/v1.55.6/Hearthstone.Deck.Tracker-v1.55.6.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          $exe = Get-ChildItem -Path $folder -File -Recurse | Where-Object { $_.Name -eq "Hearthstone Deck Tracker.exe" } | Select-Object -First 1
          if (-not $exe) { throw "Pinned HDT executable missing" }
          "HDT_PATH=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
      - name: Compile and bundle HDT plugin
        shell: pwsh
        run: |
          dotnet build plugin/HearthstoneMcpPlugin.csproj -c Release "-p:HdtPath=$env:HDT_PATH"
          if ($LASTEXITCODE -ne 0) { throw "Plugin build failed" }
          $src = "plugin/bin/Release/net472/HearthstoneMcpPlugin.dll"
          if (-not (Test-Path $src)) { throw "Compiled HDT DLL missing" }
          New-Item -Path "desktop/Coach.App/Resources" -ItemType Directory -Force | Out-Null
          Copy-Item $src "desktop/Coach.App/Resources/HearthstoneMcpPlugin.dll"
      - name: Build Windows desktop UI
        run: dotnet build desktop/Coach.App/Coach.App.csproj -c Release
      - name: Validate embedded desktop updater
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "desktop/Coach.App/Resources/apply-update.ps1").Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Desktop updater script has PowerShell syntax errors: $($errors -join '; ')" }
          $app = (Resolve-Path "desktop/Coach.App/bin/Release/net8.0-windows/HearthstoneCoach.dll").Path
          $assembly = [System.Reflection.Assembly]::LoadFile($app)
          $embedded = $assembly.GetManifestResourceStream("Coach.App.UpdaterScript")
          if ($null -eq $embedded) { throw "Missing embedded desktop updater resource" }
          $mem = [System.IO.MemoryStream]::new()
          try {
            $embedded.CopyTo($mem)
            $actual = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($mem.ToArray()))
            $source = (Get-FileHash "desktop/Coach.App/Resources/apply-update.ps1" -Algorithm SHA256).Hash
            if ($actual -ne $source) { throw "Embedded desktop updater does not match verified source" }
          } finally { $embedded.Dispose(); $mem.Dispose() }
      - name: Exercise updater against real Windows files
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "coach-update-smoke"
          $installation = Join-Path $root "installed"
          $stage = Join-Path $root "staged"
          New-Item -ItemType Directory -Path $installation, $stage -Force | Out-Null
          Copy-Item "$env:WINDIR/System32/where.exe" (Join-Path $installation "HearthstoneCoach.exe")
          Copy-Item "$env:WINDIR/System32/whoami.exe" (Join-Path $stage "HearthstoneCoach.exe")
          $targetHash = (Get-FileHash (Join-Path $stage "HearthstoneCoach.exe")).Hash
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "desktop/Coach.App/Resources/apply-update.ps1" -AppPid 999999 -InstallDir $installation -StageDir $stage -UpdateDir $root
          if ($LASTEXITCODE -ne 0) { throw "Updater helper exited with $LASTEXITCODE" }
          $actualHash = (Get-FileHash (Join-Path $installation "HearthstoneCoach.exe")).Hash
          if ($actualHash -ne $targetHash) { throw "Windows helper failed to replace the executable" }
      - name: Verify embedded plugin byte-for-byte
        shell: pwsh
        run: |
          $app = (Resolve-Path "desktop/Coach.App/bin/Release/net8.0-windows/HearthstoneCoach.dll").Path
          $assembly = [System.Reflection.Assembly]::LoadFile($app)
          $stream = $assembly.GetManifestResourceStream("Coach.App.BundledHdtPlugin")
          if ($null -eq $stream) { throw "Bundled HDT DLL resource missing: refusing publication" }
          $buffer = New-Object System.IO.MemoryStream
          try {
            $stream.CopyTo($buffer)
            $hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($buffer.ToArray()))
            $sourceHash = (Get-FileHash "plugin/bin/Release/net472/HearthstoneMcpPlugin.dll" -Algorithm SHA256).Hash
            if ($hash -ne $sourceHash) { throw "Embedded DLL checksum mismatch" }
          } finally {
            $stream.Dispose()
            $buffer.Dispose()
          }
      - name: Publish self-contained Windows app
        run: dotnet publish desktop/Coach.App/Coach.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:InformationalVersion=${{ github.sha }} -o dist/HearthstoneCoach
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Hearthstone-AI-Coach-win-x64
          path: dist/HearthstoneCoach/**
          if-no-files-found: error
          retention-days: 30
      - name: Package self-updating desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/HearthstoneCoach/*" -DestinationPath "dist/HearthstoneCoach-win-x64.zip" -Force
          $sha = (Get-FileHash "dist/HearthstoneCoach-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = "$env:GITHUB_SHA"
            sha256 = $sha
            asset = "HearthstoneCoach-win-x64.zip"
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("dist/HearthstoneCoach-update.json", $manifest, [System.Text.UTF8Encoding]::new($false))
      - name: Publish rolling self-update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "$env:GITHUB_REPOSITORY"
          gh release view app-latest --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create app-latest "dist/HearthstoneCoach-win-x64.zip" "dist/HearthstoneCoach-update.json" --repo $repo --target "$env:GITHUB_SHA" --title "Hearthstone AI Coach — najnowsza wersja" --notes "Wydanie dla aktualizacji bezpośrednio w aplikacji."
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się utworzyć release aplikacji." }
          } else {
            # Publish the manifest last so an incomplete upload cannot advertise a new package.
            gh release upload app-latest "dist/HearthstoneCoach-win-x64.zip" --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się opublikować ZIP aplikacji." }
            gh release upload app-latest "dist/HearthstoneCoach-update.json" --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się opublikować manifestu aplikacji." }
          }
