name: MCP protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check server syntax
        run: python -m py_compile mcp_server/server.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-plugin-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download HDT release for compile smoke test
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "hdt.zip"
          $folder = Join-Path $env:RUNNER_TEMP "hdt"
          Invoke-WebRequest -Uri "https://github.com/HearthSim/Hearthstone-Deck-Tracker/releases/download/v1.55.6/Hearthstone.Deck.Tracker-v1.55.6.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          $exe = Get-ChildItem -Path $folder -File -Recurse | Where-Object { $_.Extension -eq ".exe" -and $_.Name -match "Hearthstone" } | Select-Object -First 1
          if (-not $exe) { throw "HDT executable not found in release ZIP" }
          "HDT_PATH=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
      - name: Build HDT plugin against released binaries
        shell: pwsh
        run: |
          dotnet build plugin/HearthstoneMcpPlugin.csproj -c Release "-p:HdtPath=$env:HDT_PATH"
      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $pluginsPath = Join-Path $env:RUNNER_TEMP "HdtTestPlugins"
          .\\scripts\\install-plugin.ps1 -DllPath "plugin\\bin\\Release\\net472\\HearthstoneMcpPlugin.dll" -PluginsPath $pluginsPath
          $installed = Join-Path $pluginsPath "HearthstoneMcpPlugin.dll"
          if (-not (Test-Path -LiteralPath $installed)) { throw "Installer did not copy DLL" }
          $originalHash = (Get-FileHash "plugin\\bin\\Release\\net472\\HearthstoneMcpPlugin.dll").Hash
          $installedHash = (Get-FileHash $installed).Hash
          if ($originalHash -ne $installedHash) { throw "Plugin checksum mismatch" }
      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: HearthstoneMcpPlugin-win
          path: plugin/bin/Release/net472/HearthstoneMcpPlugin.dll
          if-no-files-found: error
          retention-days: 30
