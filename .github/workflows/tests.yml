name: MCP protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check server syntax
        run: python -m py_compile mcp_server/server.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
